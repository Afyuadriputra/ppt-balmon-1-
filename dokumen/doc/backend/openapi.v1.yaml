                    berbagai kebutuhan, termasuk transportasi, logistik, industri, keamanan, dan penanggulangan
                    bencana.
                  - Penggunaan frekuensi tanpa izin, tidak sesuai ISR, atau menggunakan perangkat yang belum memenuhi
