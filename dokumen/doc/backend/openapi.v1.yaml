  /complaints:
    get:
      tags:
      - Services
      summary: Retrieve harmful interference complaint procedure and channels
      operationId: getComplaintInfo
      responses:
        '200':
          description: Canonical public payload in the standard success envelope.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintInfoDTOResponse'
              example:
                success: true
                data:
                  eyebrow: Layanan Bebas Biaya
                  title: Pengaduan Gangguan Frekuensi Radio
                  description: Layanan prioritas penanganan laporan interferensi frekuensi radio untuk menjaga ketertiban,
                    keselamatan penerbangan, maritim, dan keandalan komunikasi publik di Provinsi Riau.
                  actionLabel: Hubungi Kanal Aduan
                  requiredInformation:
                  - Identitas resmi pelapor dan kontak penanggung jawab teknis stasiun radio
                  - Nomor Izin Stasiun Radio (ISR) yang sah dan masih aktif
                  - 'Frekuensi kerja yang mengalami gangguan (misal: 121.5 MHz, 850 MHz, dll.)'
                  - Lokasi stasiun pemancar dan area sebaran terjadinya interferensi
                  - Karakteristik gangguan (bunyi dengung, siaran tumpang tindih, intermodulasi, atau sinyal mati
                    total)
                  - Waktu dan durasi terjadinya gangguan (terus-menerus atau waktu tertentu)
                  steps:
                  - title: 1. Pemeriksaan Mandiri
                    detail: Pastikan instalasi internal, kabel feeder, konektor, filter, dan antena pemancar Anda
                      dalam kondisi prima.
                  - title: 2. Pengumpulan Bukti Awal
                    detail: Catat jam terjadinya interferensi dan rekam sampel audio atau foto tampilan layar spectrum
                      analyzer bila tersedia.
                  - title: 3. Penyampaian Laporan
                    detail: Sampaikan laporan resmi melalui email, telepon hotline aduan, atau loket pelayanan Balmon
                      Pekanbaru.
                  - title: 4. Observasi & Pelacakan Lapangan
                    detail: Tim teknis Balmon bergerak ke titik lokasi menggunakan stasiun pemonitor bergerak (Mobile
                      Direction Finding).
                  - title: 5. Tindakan Penghentian
                    detail: Petugas mengidentifikasi sumber pancaran ilegal dan melakukan penertiban secara terkoordinasi.
                  channels:
                    phone: (0761) 65735
                    email: upt_pekanbaru@postel.go.id
                    office: Jl. Soekarno - Hatta No. 244, Arengka Atas, Pekanbaru, Riau 28125
                    onlinePortal: https://laporgangguansfr.postel.go.id/
                meta:
                  timestamp: '2026-11-05T09:00:00.000Z'
