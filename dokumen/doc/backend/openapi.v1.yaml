                  summary: Layanan pengukuran dan monitoring spektrum frekuensi radio.
                  description: Layanan pengukuran teknis parameter pancaran gelombang elektromagnetik, level daya,
                    deviasi frekuensi, dan harmonisa untuk memastikan stasiun radio pemancar beroperasi sesuai spesifikasi
