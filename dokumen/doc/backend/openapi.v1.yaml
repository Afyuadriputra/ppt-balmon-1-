                data:
                - id: edu-spektrum
                  slug: mengenal-spektrum-frekuensi-radio
                  title: Apa Itu Spektrum Frekuensi Radio?
                  summary: Spektrum frekuensi radio merupakan sumber daya alam yang terbatas dan strategis sehingga
                    penggunaannya perlu diatur dan dikelola.
                  content:
                  - Spektrum frekuensi radio digunakan oleh berbagai sistem komunikasi nirkabel dan menjadi sumber
                    daya yang digunakan bersama.
                  - Pengelolaannya perlu dilakukan secara efisien agar berbagai layanan dapat beroperasi sesuai
                    alokasi serta meminimalkan interferensi.
                  icon: waves
                  source:
                    label: JDIH Kemkomdigi
                    publisher: Kementerian Komunikasi dan Digital
                    url: https://jdih.komdigi.go.id/produk_hukum/view/id/1005/t/peraturan%2Bmenteri%2Bkomunikasi%2Bdan%2Bdigital%2Bnomor%2B8%2Btahun%2B2026
                  image:
                    type: url
                    url: https://radiokomunikasi.com/wp-content/uploads/2023/06/bands-radio-frequency-spectrum.webp
                    alt: Ilustrasi edukasi spektrum frekuensi radio
                - id: edu-isr
                  slug: mengapa-penggunaan-frekuensi-harus-tertib
                  title: Mengapa Penggunaan Frekuensi Harus Tertib?
                  summary: Penggunaan frekuensi yang tidak sesuai izin atau parameter teknis dapat menimbulkan interferensi
                    terhadap pengguna lain.
                  content:
                  - Penggunaan frekuensi perlu mengikuti izin dan parameter teknis yang berlaku agar tidak mengganggu
                    layanan komunikasi lain.
                  - Kepatuhan terhadap ISR dan ketentuan teknis merupakan bagian dari upaya menjaga kualitas komunikasi
                    yang menggunakan spektrum bersama.
                  icon: radio-tower
                  source:
                    label: Direktorat Jenderal Infrastruktur Digital
                    publisher: Kementerian Komunikasi dan Digital
                    url: https://infradigital.komdigi.go.id/berita-spektrum-tertib-komunikasi-lancar-jaga-frekuensi-radio-untuk-layanan-masyarakat-27-6855
                  image:
                    type: url
                    url: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-HPqI3AixZqkUSUduX8jzF6-ohmweW8EBseo5vuF8qI3_gZXpgBBcA24&s=10
                    alt: Ilustrasi ketertiban penggunaan frekuensi radio
                  videoId: j7YUD0ZfuRw
                - id: edu-gangguan
                  slug: cara-penanganan-gangguan-spektrum
                  title: Bagaimana Gangguan Spektrum Ditangani?
                  summary: DJID menyediakan prosedur resmi penanganan gangguan spektrum frekuensi radio melalui
                    kegiatan monitoring dan tindak lanjut teknis.
                  content:
                  - Gangguan spektrum perlu dilaporkan melalui kanal resmi agar informasi teknis dapat diverifikasi
                    dan ditindaklanjuti.
                  - UPT monitoring spektrum memiliki peran dalam pemantauan, pelacakan, pengukuran, dan penanganan
                    sumber gangguan sesuai prosedur.
                  icon: radar
                  source:
                    label: Direktorat Jenderal Infrastruktur Digital
                    publisher: Kementerian Komunikasi dan Digital
                    url: https://infradigital.komdigi.go.id/artikel-monitoring-spektrum-frekuensi-radio-prosedur-penanganan-gangguan-11-610
                  image:
                    type: url
                    url: https://postel.go.id/uploads/pages/20241218003332-Picture1.png
                    alt: Ilustrasi penanganan gangguan spektrum frekuensi radio
                - id: edu-repeater
                  slug: repeater-seluler-ilegal
                  title: Mengapa Repeater Seluler Ilegal Bisa Mengganggu Jaringan?
                  summary: Repeater yang digunakan tanpa pengaturan yang tepat dapat menghasilkan pancaran yang
                    mengganggu jaringan telekomunikasi di sekitarnya.
                  content:
                  - Perangkat repeater memperkuat dan memancarkan ulang sinyal seluler. Penggunaan yang tidak terkontrol
                    dapat mengganggu performa jaringan operator.
                  - Pemerintah melakukan monitoring dan penertiban terhadap penggunaan repeater yang tidak memenuhi
                    ketentuan.
                  icon: triangle-alert
                  source:
                    label: Direktorat Jenderal Infrastruktur Digital
                    publisher: Kementerian Komunikasi dan Digital
                    url: https://infradigital.komdigi.go.id/berita-gangguan-jaringan-telekomunikasi-akibat-penggunaan-repeater-seluler-26-2093
                  image:
                    type: url
                    url: https://postel.go.id/uploads/pages/20140102103108-mini-repeater-application.jpg
                    alt: Ilustrasi gangguan jaringan akibat repeater seluler
                - id: edu-sertifikasi
                  slug: sertifikasi-perangkat-telekomunikasi
                  title: Mengapa Perangkat Telekomunikasi Perlu Tersertifikasi?
                  summary: Sertifikasi membantu memastikan perangkat yang digunakan di Indonesia memenuhi persyaratan
                    teknis dan tidak menimbulkan interferensi.
                  content:
                  - Sertifikasi alat dan perangkat telekomunikasi merupakan bagian dari pelayanan pemerintah untuk
                    memastikan kesesuaian perangkat dengan persyaratan teknis.
                  - Pengujian dan sertifikasi membantu menjaga interoperabilitas serta mengurangi risiko gangguan
                    ketika perangkat digunakan pada jaringan telekomunikasi.
                  icon: shield-check
                  source:
                    label: Direktorat Jenderal Infrastruktur Digital
                    publisher: Kementerian Komunikasi dan Digital
                    url: https://infradigital.komdigi.go.id/artikel-hasil-survey-pelayanan-publik-1-2233
                  image:
                    type: url
                    url: https://sertifikatsdppi.id/wp-content/uploads/2023/02/foto-untuk-diisi-artikel-Tarif-1024x576.png
                    alt: Ilustrasi sertifikasi perangkat telekomunikasi
                - id: edu-tasfri
                  slug: mengenal-tasfri-2026
                  title: Mengenal TASFRI 2026
                  summary: TASFRI menjadi pedoman pengalokasian pita frekuensi radio di Indonesia dan mengacu pada
                    Radio Regulations ITU edisi 2024.
                  content:
                  - Peraturan Menteri Komunikasi dan Digital Nomor 8 Tahun 2026 mengatur Tabel Alokasi Spektrum
                    Frekuensi Radio Indonesia.
                  - Tabel ini digunakan sebagai pedoman perencanaan, pengelolaan, dan pemanfaatan spektrum frekuensi
                    radio di Indonesia.
                  icon: table-properties
                  source:
                    label: JDIH Kemkomdigi
