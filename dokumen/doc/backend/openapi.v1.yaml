                    url: https://jdih.komdigi.go.id/produk_hukum/view/id/1005/t/peraturan%2Bmenteri%2Bkomunikasi%2Bdan%2Bdigital%2Bnomor%2B8%2Btahun%2B2026
                  image:
                    type: url
                    url: https://justisio.com/_next/image?url=https%3A%2F%2Fstorage.googleapis.com%2Fjustisio-public-asset%2Falokasi-spektrum-frekuensi-radio-indonesia-klasifikasi-dan-kerangka-pengelolaan-berdasarkan-permenkomdigital-no-8-2026-691880.webp&w=3840&q=75
                    alt: Ilustrasi Tabel Alokasi Spektrum Frekuensi Radio Indonesia 2026
                - id: edu-gnss
                  slug: gangguan-gnss-dan-keselamatan-penerbangan
                  title: Gangguan GNSS dan Keselamatan Penerbangan
                  summary: Interferensi pada sinyal navigasi satelit perlu diidentifikasi dan dimitigasi karena
                    GNSS digunakan dalam operasional penerbangan.
                  content:
                  - GNSS menyediakan informasi posisi, navigasi, dan waktu yang digunakan untuk berbagai kebutuhan
                    termasuk penerbangan.
                  - Pengukuran teknis terhadap sumber pancaran membantu pemerintah memahami karakteristik gangguan
                    dan menentukan langkah mitigasi.
                  icon: plane
                  source:
