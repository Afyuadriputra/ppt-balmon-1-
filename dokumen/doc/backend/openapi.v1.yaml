  /faqs:
    get:
      tags:
      - Services
      summary: List frequently asked questions
      operationId: listFaqs
      responses:
        '200':
          description: Canonical public payload in the standard success envelope.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqListDTOResponse'
              example:
                success: true
                data:
                - question: Apakah penanganan pengaduan gangguan frekuensi dikenakan biaya?
                  answer: Tidak. Seluruh proses observasi, pelacakan lapangan, dan penanganan gangguan frekuensi
                    radio oleh Balmon Pekanbaru tidak dipungut biaya (bebas biaya/gratis).
                - question: Siapa yang berhak mengajukan aduan gangguan frekuensi?
                  answer: Setiap pengguna spektrum frekuensi radio yang memiliki Izin Stasiun Radio (ISR) sah dan
                    aktif dari Kementerian Komunikasi dan Digital yang operasionalnya terganggu oleh sinyal liar.
                - question: Bagaimana cara mengajukan Izin Stasiun Radio (ISR)?
                  answer: Permohonan ISR diajukan melalui portal resmi https://isr.postel.go.id/. Informasi tata
                    cara penggunaan sistem dapat dilihat melalui https://pelayanansdppi.postel.go.id/panduan-tutorial.
                - question: Mengapa penggunaan penguat sinyal (repeater/booster) mandiri dilarang?
                  answer: Repeater tanpa izin memancarkan sinyal bising liar (noise) yang mengacaukan base transceiver
                    station (BTS) operator resmi dan dapat melumpuhkan layanan komunikasi seluler di sekitarnya.
                    Penggunaan repeater ilegal melanggar UU Telekomunikasi.
                meta:
                  timestamp: '2026-11-05T09:00:00.000Z'
                  version: 1.0.0
                  sourceMode: live_database
